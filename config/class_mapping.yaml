# ============================================================
# AgriVision Class Mapping — Single Source of Truth
# ============================================================
# Every canonical class is defined here with:
#   id            : YOLO class index used in .txt labels and data.yaml
#   source_labels : per-provider label names that map to this class
#
# Used by:
#   download_dataset.py → knows what to request from each provider
#   merge_dataset.py    → knows how to map incoming labels to canonical class
#
# ALIASING RULE: Only add a source label if you are confident that the
# provider uses it specifically for THIS class. When in doubt, leave it out.
# Empty list [] = class not available from that provider (explicit declaration).
# ============================================================

classes:

  Tree:
    id: 0
    source_labels:
      openimages:
        - Tree
      roboflow:
        - Coconut Tree
        - Palm
        - Tree
        - tree
      roboflow_tree-stump:
        - tree
      kaggle:
        - tree
        - palm_tree
        - coconut_tree
      manual:
        - tree

  Stump:
    id: 1
    source_labels:
      openimages: []          # not available in Open Images V7
      roboflow:
        - Tree stump
        - Stump
        - stump
      roboflow_tree-stump:
        - trees-stump
      kaggle:
        - stump
        - tree_stump
      manual:
        - stump
        - log

