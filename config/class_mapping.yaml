      roboflow:
        - Weed
        - Grass weed
        - Invasive plant
        - weed
      roboflow_weed-detection-5jm0z:
        - Weeds
      kaggle:
        - weed
        - grass_weed
        - unwanted_plant
        - invasive_plant
      manual:
        - weed

  Bush:
    id: 5
    source_labels:
      openimages: []
      roboflow:
        - Bush
        - Shrub
